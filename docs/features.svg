<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><defs>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2dd4bf"/></marker>
<filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#2dd4bf" flood-opacity=".35"/></filter></defs><rect width="1200" height="480" rx="20" fill="#0a0a0a"/><rect width="1200" height="480" rx="20" fill="url(#grid)"/><text x="40" y="52" font-size="13" font-weight="700" letter-spacing="3" fill="#2dd4bf">FEATURES</text><text x="40" y="84" font-size="26" font-weight="700" fill="#fff">Everything you need to ship a PHP site</text><g transform="translate(40,120)"><rect width="265" height="150" rx="14" fill="#141414" stroke="#262626"/><rect x="24" y="22" width="34" height="34" rx="9" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".4"/><text x="41" y="44" font-size="13" font-weight="800" fill="#2dd4bf" text-anchor="middle">01</text><text x="72" y="45" font-size="17" font-weight="700" fill="#fff">Instant deploy</text><text x="24" y="96" font-size="14" fill="#a3a3a3">Upload a ZIP, pick a GitHub</text><text x="24" y="116" font-size="14" fill="#a3a3a3">repo or run the CLI. Live in</text><text x="24" y="136" font-size="14" fill="#a3a3a3">seconds.</text></g><g transform="translate(325,120)"><rect width="265" height="150" rx="14" fill="#141414" stroke="#262626"/><rect x="24" y="22" width="34" height="34" rx="9" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".4"/><text x="41" y="44" font-size="13" font-weight="800" fill="#2dd4bf" text-anchor="middle">02</text><text x="72" y="45" font-size="17" font-weight="700" fill="#fff">Auto subdomains</text><text x="24" y="96" font-size="14" fill="#a3a3a3">name.dockhosting.dev routed by</text><text x="24" y="116" font-size="14" fill="#a3a3a3">nginx-proxy. No DNS work.</text></g><g transform="translate(610,120)"><rect width="265" height="150" rx="14" fill="#141414" stroke="#262626"/><rect x="24" y="22" width="34" height="34" rx="9" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".4"/><text x="41" y="44" font-size="13" font-weight="800" fill="#2dd4bf" text-anchor="middle">03</text><text x="72" y="45" font-size="17" font-weight="700" fill="#fff">Free SSL</text><text x="24" y="96" font-size="14" fill="#a3a3a3">Let's Encrypt certificates</text><text x="24" y="116" font-size="14" fill="#a3a3a3">issued and renewed</text><text x="24" y="136" font-size="14" fill="#a3a3a3">automatically.</text></g><g transform="translate(895,120)"><rect width="265" height="150" rx="14" fill="#141414" stroke="#262626"/><rect x="24" y="22" width="34" height="34" rx="9" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".4"/><text x="41" y="44" font-size="13" font-weight="800" fill="#2dd4bf" text-anchor="middle">04</text><text x="72" y="45" font-size="17" font-weight="700" fill="#fff">MySQL per project</text><text x="24" y="96" font-size="14" fill="#a3a3a3">One-click databases with their</text><text x="24" y="116" font-size="14" fill="#a3a3a3">own user, plus phpMyAdmin.</text></g><g transform="translate(40,290)"><rect width="265" height="150" rx="14" fill="#141414" stroke="#262626"/><rect x="24" y="22" width="34" height="34" rx="9" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".4"/><text x="41" y="44" font-size="13" font-weight="800" fill="#2dd4bf" text-anchor="middle">05</text><text x="72" y="45" font-size="17" font-weight="700" fill="#fff">File manager</text><text x="24" y="96" font-size="14" fill="#a3a3a3">Create, edit, upload and</text><text x="24" y="116" font-size="14" fill="#a3a3a3">delete files right in the</text><text x="24" y="136" font-size="14" fill="#a3a3a3">browser.</text></g><g transform="translate(325,290)"><rect width="265" height="150" rx="14" fill="#141414" stroke="#262626"/><rect x="24" y="22" width="34" height="34" rx="9" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".4"/><text x="41" y="44" font-size="13" font-weight="800" fill="#2dd4bf" text-anchor="middle">06</text><text x="72" y="45" font-size="17" font-weight="700" fill="#fff">Container controls</text><text x="24" y="96" font-size="14" fill="#a3a3a3">Start, stop, restart and watch</text><text x="24" y="116" font-size="14" fill="#a3a3a3">CPU and memory stats.</text></g><g transform="translate(610,290)"><rect width="265" height="150" rx="14" fill="#141414" stroke="#262626"/><rect x="24" y="22" width="34" height="34" rx="9" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".4"/><text x="41" y="44" font-size="13" font-weight="800" fill="#2dd4bf" text-anchor="middle">07</text><text x="72" y="45" font-size="17" font-weight="700" fill="#fff">Admin panel</text><text x="24" y="96" font-size="14" fill="#a3a3a3">Users, projects, logs,</text><text x="24" y="116" font-size="14" fill="#a3a3a3">analytics, announcements,</text><text x="24" y="136" font-size="14" fill="#a3a3a3">maintenance.</text></g><g transform="translate(895,290)"><rect width="265" height="150" rx="14" fill="#141414" stroke="#262626"/><rect x="24" y="22" width="34" height="34" rx="9" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".4"/><text x="41" y="44" font-size="13" font-weight="800" fill="#2dd4bf" text-anchor="middle">08</text><text x="72" y="45" font-size="17" font-weight="700" fill="#fff">Secure by default</text><text x="24" y="96" font-size="14" fill="#a3a3a3">bcrypt, CSRF guard, audit logs</text><text x="24" y="116" font-size="14" fill="#a3a3a3">and isolated containers.</text></g></svg>